<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us — Glaubark Solutions</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: { ink: '#1c1c1c', sub: '#6b6b6b' },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/custom.css" />
</head>
<body class="bg-white text-ink" data-page="contact">

  <div id="site-header-slot"></div>

  <main>
    <section class="page-banner relative flex items-end">
      <div class="absolute inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1423666639045-f5600c027da8?auto=format&fit=crop&w=1920&q=80" alt="" class="w-full h-full object-cover" />
        <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-black/20 to-black/60"></div>
      </div>
      <div class="relative z-10 max-w-[1400px] mx-auto w-full px-5 md:px-8 lg:px-12 pt-[120px] pb-16 md:pb-20">
        <h1 class="text-4xl md:text-5xl lg:text-6xl font-semibold text-white tracking-tight">Contact Us</h1>
        <p class="text-white/80 mt-4 max-w-lg text-sm md:text-base">Get in touch with our team to learn how Glaubark can support your goals.</p>
      </div>
    </section>

    <section class="max-w-[1400px] mx-auto px-5 md:px-8 lg:px-12 py-16 md:py-24">
      <p class="text-sub">Page content coming soon.</p>
    </section>
  </main>

  <div id="site-footer-slot"></div>

  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
